name: NSE F&O download and audit
on:
  workflow_dispatch:
    inputs:
      trade_date:
        description: "NSE trading date (YYYY-MM-DD), e.g. 2026-11-11"
        required: true
        type: string
permissions:
  contents: read
  actions: write
jobs:
  download-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install downloader dependency
        run: python -m pip install --upgrade requests
      - name: Download and audit NSE reports
        id: audit
        continue-on-error: true
        run: |
          python scripts/nse_download_audit.py --date "${{ inputs.trade_date }}" --out audit-output
      - name: Upload raw files and audit manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nse-audit-${{ inputs.trade_date }}
          path: audit-output/
          if-no-files-found: warn
          retention-days: 7
      - name: Fail job if no reports were downloaded
        if: steps.audit.outcome == 'failure'
        run: exit 1
