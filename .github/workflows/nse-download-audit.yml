name: NSE F&O download and audit
on:
  workflow_dispatch:
    inputs:
      trade_date:
        description: "NSE trading date (YYYY-MM-DD)"
        required: true
        type: string
permissions:
  contents: read
jobs:
  download-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Explain why automated NSE collection is paused
        run: |
          echo "Automated NSE website collection is paused pending express written permission from NSE."
          echo "Use the official NSE report page manually for individual downloads."
          echo "Do not run scripted or scheduled collection unless NSE permission is obtained."
