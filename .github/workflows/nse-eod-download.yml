name: NSE EOD report download and audit

on:
  workflow_dispatch:
    inputs:
      trade_date:
        description: "Trading date (YYYY-MM-DD)"
        required: true
        type: string
      market_activity_url:
        description: "Official NSE download URL for F&O Market Activity ZIP"
        required: true
        type: string
      bhavcopy_url:
        description: "Official NSE download URL for F&O UDiFF Bhavcopy ZIP (or legacy FO ZIP)"
        required: true
        type: string
      participant_oi_url:
        description: "Official NSE download URL for Participant-wise OI CSV"
        required: true
        type: string
      participant_volume_url:
        description: "Official NSE download URL for Participant-wise Trading Volumes CSV"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: nse-eod-${{ inputs.trade_date }}
  cancel-in-progress: false

jobs:
  download-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download official NSE reports with retries
        env:
          TRADE_DATE: ${{ inputs.trade_date }}
          MARKET_ACTIVITY_URL: ${{ inputs.market_activity_url }}
          BHAVCOPY_URL: ${{ inputs.bhavcopy_url }}
          PARTICIPANT_OI_URL: ${{ inputs.participant_oi_url }}
          PARTICIPANT_VOLUME_URL: ${{ inputs.participant_volume_url }}
        run: |
          python - <<'PY'
          import csv, hashlib, json, os, re, sys, time, zipfile
          from datetime import date
          from pathlib import Path
          from urllib.parse import urlparse
          from urllib.request import Request, urlopen
          from urllib.error import URLError, HTTPError

          trade_date = date.fromisoformat(os.environ["TRADE_DATE"])
          date_tokens = {
              trade_date.strftime("%d%m%Y"),
              trade_date.strftime("%Y%m%d"),
              trade_date.strftime("%d-%b-%Y").upper(),
          }
          out = Path("nse-eod")
          raw, extracted = out / "raw", out / "extracted"
          raw.mkdir(parents=True, exist_ok=True)
          extracted.mkdir(parents=True, exist_ok=True)

          reports = [
              ("market_activity", os.environ["MARKET_ACTIVITY_URL"], "zip"),
              ("bhavcopy", os.environ["BHAVCOPY_URL"], "zip"),
              ("participant_oi", os.environ["PARTICIPANT_OI_URL"], "csv"),
              ("participant_volume", os.environ["PARTICIPANT_VOLUME_URL"], "csv"),
          ]
          manifest = {
              "trade_date": trade_date.isoformat(),
              "timezone": "Asia/Kolkata",
              "source_policy": "URLs supplied from the official NSE report page; no guessed URLs",
              "reports": []
          }

          def fail(msg):
              raise RuntimeError(msg)

          def fetch(name, url, expected):
              parsed = urlparse(url)
              if parsed.scheme != "https" or not (parsed.hostname or "").lower().endswith("nseindia.com"):
                  fail(f"{name}: URL must be HTTPS on an NSE-owned nseindia.com host")
              url_path = urlparse(url).path.upper()
              if not any(token in url_path for token in date_tokens):
                  fail(f"{name}: URL filename does not contain the requested trade date {trade_date}; refusing an unverified date")
              path = raw / (name + (".zip" if expected == "zip" else ".csv"))
              last_error = None
              for attempt in range(1, 5):
                  try:
                      req = Request(url, headers={
                          "User-Agent": "Mozilla/5.0 (compatible; NIFTY50DataAudit/1.0)",
                          "Accept": "application/zip,text/csv,application/octet-stream,*/*",
                          "Referer": "https://www.nseindia.com/all-reports-derivatives"
                      })
                      with urlopen(req, timeout=45) as response:
                          data = response.read()
                          final_host = (urlparse(response.geturl()).hostname or "").lower()
                          if not final_host.endswith("nseindia.com"):
                              fail(f"{name}: redirected outside NSE domain")
                      if not data:
                          fail(f"{name}: empty response")
                      if data.lstrip().lower().startswith((b"<!doctype html", b"<html")):
                          fail(f"{name}: received HTML page, not report file")
                      if expected == "zip" and not data.startswith(b"PK"):
                          fail(f"{name}: response is not a ZIP archive")
                      if expected == "csv" and b"," not in data[:8192] and b";" not in data[:8192]:
                          fail(f"{name}: response does not look like CSV")
                      path.write_bytes(data)
                      return path
                  except Exception as exc:
                      last_error = str(exc)
                      if attempt < 4:
                          time.sleep(2 ** attempt)
              fail(f"{name}: download failed after 4 attempts: {last_error}")

          def inspect_csv(path, report_name):
              try:
                  with path.open("r", encoding="utf-8-sig", newline="", errors="replace") as f:
                      sample = f.read(16384)
                      f.seek(0)
                      try:
                          dialect = csv.Sniffer().sniff(sample, delimiters=",;|\\t")
                      except csv.Error:
                          dialect = csv.excel
                      reader = csv.reader(f, dialect)
                      rows = [row for row in reader if any(cell.strip() for cell in row)]
              except Exception as exc:
                  fail(f"{report_name}: CSV parse error: {exc}")
              if len(rows) < 2:
                  fail(f"{report_name}: CSV has no data rows")
              header = [x.strip() for x in rows[0]]
              if len(header) < 2 or not any(header):
                  fail(f"{report_name}: invalid CSV header")
              return {"header": header, "data_rows": len(rows)-1, "delimiter": repr(dialect.delimiter)}

          def extract_zip(path, report_name):
              dest = extracted / report_name
              dest.mkdir(parents=True, exist_ok=True)
              try:
                  with zipfile.ZipFile(path) as zf:
                      bad = zf.testzip()
                      if bad:
                          fail(f"{report_name}: corrupt ZIP member {bad}")
                      members = []
                      for info in zf.infolist():
                          if info.is_dir():
                              continue
                          name = Path(info.filename).name
                          if not name or name.startswith(".") or ".." in Path(info.filename).parts:
                              fail(f"{report_name}: unsafe ZIP member path")
                          target = dest / name
                          target.write_bytes(zf.read(info))
                          members.append({"file": name, "bytes": info.file_size})
              except zipfile.BadZipFile as exc:
                  fail(f"{report_name}: invalid ZIP: {exc}")
              csv_reports = []
              for item in members:
                  if item["file"].lower().endswith(".csv"):
                      info = inspect_csv(dest / item["file"], report_name + "/" + item["file"])
                      csv_reports.append({"file": item["file"], **info})
              if not csv_reports:
                  fail(f"{report_name}: ZIP contains no CSV files")
              names = [x["file"].lower() for x in csv_reports]
              if report_name == "market_activity":
                  # Legacy naming and current index-summary names are both accepted;
                  # actual ZIP members are recorded, never assumed.
                  formats = []
                  if any(n.startswith(("futidx", "optidx")) for n in names):
                      formats.append("legacy-index-summary-naming")
                  if any(n.startswith(("fut", "opt")) for n in names):
                      formats.append("market-activity-futures-options-naming")
                  if not formats:
                      formats.append("unknown-schema-review-required")
              else:
                  formats = ["UDiFF" if any("bhavcopy_nse_fo" in n for n in names) else "legacy-or-other"]
              return {"members": members, "csv_files": csv_reports, "format_hints": formats}

          for name, url, kind in reports:
              record = {"name": name, "url": url, "status": "PENDING"}
              try:
                  path = fetch(name, url, kind)
                  data = path.read_bytes()
                  record.update({
                      "file": str(path),
                      "bytes": len(data),
                      "sha256": hashlib.sha256(data).hexdigest(),
                      "date_token_verified_in_url": True,
                      "status": "DOWNLOADED"
                  })
                  if kind == "zip":
                      record.update(extract_zip(path, name))
                  else:
                      record.update(inspect_csv(path, name))
                  record["status"] = "VALIDATED"
              except Exception as exc:
                  record["status"] = "FAILED"
                  record["error"] = str(exc)
                  manifest["reports"].append(record)
                  (out / "manifest.json").write_text(json.dumps(manifest, indent=2), encoding="utf-8")
                  raise
              manifest["reports"].append(record)

          (out / "manifest.json").write_text(json.dumps(manifest, indent=2), encoding="utf-8")
          print(json.dumps(manifest, indent=2))
          PY

      - name: Upload original files, extracted CSVs and audit manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nse-eod-${{ inputs.trade_date }}
          path: nse-eod/
          if-no-files-found: warn
          retention-days: 90
